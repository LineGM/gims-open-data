[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gims-open-data"
version = "1.0.0"
description = "Sequential importer for the official MChS GIMS marathon"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27,<0.29", "beautifulsoup4>=4.12,<5", "pydantic>=2.7,<3"]

[project.optional-dependencies]
reference = ["PyMuPDF>=1.24,<2", "rapidfuzz>=3,<4", "Pillow>=10,<13"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
gims-import = "gims_open_data.importer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/gims_open_data"]
